[project]
name = "mycarla"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "carla==0.9.15",
    "gym==0.26.2",
    "networkx>=3.4.2",
    "numpy==1.24.4",
    "python-dateutil>=2.9.0.post0",
    "tabulate>=0.9.0",
    "tqdm==4.64.1",
    "torch",
    "torchvision",
    "wandb>=0.22.1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
